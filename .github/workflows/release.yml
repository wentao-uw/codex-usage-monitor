name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify version tag
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/CodexUsageMenuBar/Support/Info.plist)
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run test:macos
      - run: npm run build:macos
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex Usage Monitor.app" "Codex-Usage-Monitor-${GITHUB_REF_NAME}-macOS.zip"
          shasum -a 256 "Codex-Usage-Monitor-${GITHUB_REF_NAME}-macOS.zip" > "Codex-Usage-Monitor-${GITHUB_REF_NAME}-macOS.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Codex-Usage-Monitor-${GITHUB_REF_NAME}-macOS.zip" \
            "Codex-Usage-Monitor-${GITHUB_REF_NAME}-macOS.zip.sha256" \
            --generate-notes \
            --title "Codex Usage Monitor ${GITHUB_REF_NAME}"
