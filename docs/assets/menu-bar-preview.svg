<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Monitor running in the macOS menu bar</title>
  <desc id="desc">A product preview with fictional usage data showing all-time and current-cycle totals, token breakdowns, per-model statistics, rolling limits, language switching, and refresh controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d24"/>
      <stop offset="0.55" stop-color="#121b43"/>
      <stop offset="1" stop-color="#092c48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7068ff"/>
      <stop offset="1" stop-color="#24d5d0"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecf6ff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="cardIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0efff"/>
      <stop offset="1" stop-color="#f8f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000719" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="190" fill="#1ae0da" opacity=".12" filter="url(#glow)"/>
  <circle cx="70" cy="700" r="220" fill="#635bff" opacity=".18" filter="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#fff">
    <text x="62" y="78" font-size="14" font-weight="700" letter-spacing="2.4" fill="#5ee6da">NATIVE MACOS MENU BAR APP</text>
    <text x="62" y="130" font-size="40" font-weight="750">Know where your</text>
    <text x="62" y="177" font-size="40" font-weight="750">Codex tokens go.</text>
    <text x="62" y="224" font-size="18" fill="#b9c3df">Local, bilingual, and always one click away.</text>

    <g transform="translate(62 280)">
      <circle cx="14" cy="14" r="14" fill="#2369ff"/>
      <path d="M7 17h3V9H7zm5 0h3V5h-3zm5 0h3v-6h-3z" fill="#fff"/>
      <text x="42" y="20" font-size="17" font-weight="650">Historical + current-cycle totals</text>
    </g>
    <g transform="translate(62 337)">
      <circle cx="14" cy="14" r="14" fill="#665dff"/>
      <path d="M7 10h14v2H7zm0 5h10v2H7z" fill="#fff"/>
      <text x="42" y="20" font-size="17" font-weight="650">Per-model token and cost breakdown</text>
    </g>
    <g transform="translate(62 394)">
      <circle cx="14" cy="14" r="14" fill="#18b8ae"/>
      <path d="M14 6a8 8 0 1 0 7.4 5h-3.2A5 5 0 1 1 14 9v3l6-4-6-4z" fill="#fff"/>
      <text x="42" y="20" font-size="17" font-weight="650">Fast incremental refresh every 10 minutes</text>
    </g>
    <g transform="translate(62 451)">
      <circle cx="14" cy="14" r="14" fill="#2f86ff"/>
      <path d="M8 8h12v12H8z" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 13h12M14 8v12" stroke="#fff" stroke-width="1.4"/>
      <text x="42" y="20" font-size="17" font-weight="650">English / 中文 in one click</text>
    </g>

    <g transform="translate(62 548)">
      <rect width="360" height="104" rx="20" fill="#ffffff" opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="34" cy="33" r="7" fill="#27d7b0"/>
      <text x="54" y="39" font-size="16" font-weight="650">Your data stays on your Mac</text>
      <text x="28" y="70" font-size="14" fill="#b9c3df">Reads local Codex logs. No telemetry.</text>
      <text x="28" y="91" font-size="12" fill="#7f8aa7">All numbers shown here are fictional demo data.</text>
    </g>
  </g>

  <g transform="translate(514 32)" filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="626" height="696" rx="24" fill="#f5f6f9" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="626" height="42" rx="24" fill="#e8ebf1"/>
    <rect x="0" y="22" width="626" height="20" fill="#e8ebf1"/>
    <circle cx="23" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="65" cy="21" r="6" fill="#28c840"/>
    <text x="313" y="27" text-anchor="middle" font-size="13" fill="#69707d">Codex Usage Monitor · demo</text>

    <g transform="translate(24 64)">
      <g transform="translate(0 0)">
        <rect width="31" height="31" rx="8" fill="#146dff"/>
        <path d="M7 23h4V12H7zm7 0h4V7h-4zm7 0h4v-8h-4z" fill="#fff"/>
      </g>
      <text x="44" y="23" font-size="22" font-weight="750" fill="#11131a">Codex Usage</text>
      <text x="44" y="43" font-size="12" fill="#737985">gpt-5.6-sol · think high</text>
      <rect x="474" y="2" width="104" height="34" rx="10" fill="#e7eaf0"/>
      <text x="526" y="24" text-anchor="middle" font-size="14" font-weight="650" fill="#272b33">English⌄</text>

      <g transform="translate(0 64)">
        <rect width="280" height="138" rx="16" fill="url(#cardBlue)" stroke="#cfe5ff"/>
        <text x="16" y="26" font-size="11" font-weight="750" letter-spacing="1.2" fill="#1671e8">ALL-TIME LOCAL</text>
        <text x="16" y="49" font-size="12" fill="#737985">Total tokens</text>
        <text x="16" y="83" font-size="27" font-weight="760" fill="#10131a">128,450,320</text>
        <line x1="16" y1="96" x2="264" y2="96" stroke="#dbe4ef"/>
        <text x="16" y="119" font-size="11" fill="#737985">API-equivalent cost</text>
        <text x="264" y="120" text-anchor="end" font-size="15" font-weight="700" fill="#252a34">≈$74.28</text>
        <text x="16" y="134" font-size="9" fill="#9aa0aa">214 sessions</text>
      </g>

      <g transform="translate(290 64)">
        <rect width="288" height="138" rx="16" fill="url(#cardIndigo)" stroke="#ddd9ff"/>
        <text x="16" y="26" font-size="11" font-weight="750" letter-spacing="1.1" fill="#635bdb">CURRENT CYCLE · 7D</text>
        <text x="16" y="49" font-size="12" fill="#737985">Total tokens</text>
        <text x="16" y="83" font-size="27" font-weight="760" fill="#10131a">3,842,910</text>
        <line x1="16" y1="96" x2="272" y2="96" stroke="#e1dff3"/>
        <text x="16" y="119" font-size="11" fill="#737985">API-equivalent cost</text>
        <text x="272" y="120" text-anchor="end" font-size="15" font-weight="700" fill="#252a34">≈$2.14</text>
        <text x="16" y="134" font-size="9" fill="#9aa0aa">Sep 8, 09:00 – Sep 15, 09:00</text>
      </g>

      <text x="0" y="228" font-size="15" font-weight="720" fill="#22262e">Current cycle · 7d</text>
      <text x="578" y="228" text-anchor="end" font-size="10" fill="#8b919c">Local-log cycle</text>

      <g transform="translate(0 241)" font-size="10" fill="#777d88">
        <g><rect width="186" height="52" rx="11" fill="#e8eaee"/><text x="12" y="20">Input</text><text x="12" y="41" font-size="15" font-weight="700" fill="#232730">3.61M</text></g>
        <g transform="translate(196 0)"><rect width="186" height="52" rx="11" fill="#e8eaee"/><text x="12" y="20">Cached input</text><text x="12" y="41" font-size="15" font-weight="700" fill="#232730">3.02M</text></g>
        <g transform="translate(392 0)"><rect width="186" height="52" rx="11" fill="#e8eaee"/><text x="12" y="20">Output</text><text x="12" y="41" font-size="15" font-weight="700" fill="#232730">232K</text></g>
        <g transform="translate(0 61)"><rect width="186" height="52" rx="11" fill="#e8eaee"/><text x="12" y="20">Reasoning</text><text x="12" y="41" font-size="15" font-weight="700" fill="#232730">91.4K</text></g>
        <g transform="translate(196 61)"><rect width="186" height="52" rx="11" fill="#e8eaee"/><text x="12" y="20">Cache hit</text><text x="12" y="41" font-size="15" font-weight="700" fill="#232730">83.7%</text></g>
        <g transform="translate(392 61)"><rect width="186" height="52" rx="11" fill="#e8eaee"/><text x="12" y="20">Current context</text><text x="12" y="41" font-size="15" font-weight="700" fill="#232730">17.1%</text></g>
      </g>

      <text x="0" y="382" font-size="15" font-weight="720" fill="#22262e">Usage by model</text>
      <g transform="translate(0 394)">
        <rect width="578" height="30" rx="8" fill="#e1e3e8"/>
        <rect x="2" y="2" width="286" height="26" rx="7" fill="#fff"/>
        <text x="145" y="20" text-anchor="middle" font-size="11" font-weight="650" fill="#30343c">Current cycle</text>
        <text x="433" y="20" text-anchor="middle" font-size="11" fill="#676d78">All-time local</text>
      </g>

      <g transform="translate(0 434)">
        <rect width="578" height="55" rx="11" fill="#e8eaee"/>
        <text x="12" y="22" font-size="13" font-weight="700" fill="#22262e">gpt-5.6-sol</text>
        <text x="12" y="41" font-size="9" fill="#767c87">Input 2.74M · Cached 2.31M · Output 188K · Reasoning 72K</text>
        <text x="564" y="22" text-anchor="end" font-size="14" font-weight="750" fill="#22262e">2.93M tokens</text>
        <text x="564" y="41" text-anchor="end" font-size="10" fill="#666d78">≈$1.68</text>
      </g>
      <g transform="translate(0 497)">
        <rect width="578" height="55" rx="11" fill="#e8eaee"/>
        <text x="12" y="22" font-size="13" font-weight="700" fill="#22262e">gpt-5.6-luna</text>
        <text x="12" y="41" font-size="9" fill="#767c87">Input 870K · Cached 710K · Output 44K · Reasoning 19K</text>
        <text x="564" y="22" text-anchor="end" font-size="14" font-weight="750" fill="#22262e">914K tokens</text>
        <text x="564" y="41" text-anchor="end" font-size="10" fill="#666d78">≈$0.46</text>
      </g>

      <text x="0" y="578" font-size="10" fill="#777d88">Updated at 11:42 PM · Refreshes every 10 minutes · Local only</text>
      <rect x="442" y="561" width="136" height="34" rx="10" fill="#e2e5ea"/>
      <path d="M459 578a8 8 0 1 0 7-7.9v3l5-4-5-4v2.8a11 11 0 1 1-9.6 5.6" fill="#262b34"/>
      <text x="516" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="#262b34">Refresh</text>
    </g>
  </g>
</svg>
