<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: #ffffff;
      --text: #15171b;
      --muted: #676d77;
      --line: rgba(24, 28, 36, 0.09);
      --accent: #635bff;
      --accent-2: #28b487;
      --accent-soft: rgba(99, 91, 255, 0.12);
      --shadow: 0 16px 44px rgba(28, 32, 45, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --panel: rgba(26, 29, 36, 0.90);
        --panel-strong: #1c1f27;
        --text: #f5f6f8;
        --muted: #9da4b0;
        --line: rgba(255, 255, 255, 0.09);
        --accent: #8b83ff;
        --accent-2: #47d7a5;
        --accent-soft: rgba(139, 131, 255, 0.16);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, var(--accent-soft), transparent 38%),
        var(--bg);
      box-shadow: var(--shadow);
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 20px 14px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 4px 0 3px; font-size: 22px; line-height: 1.15; letter-spacing: -.025em; }
    .sub { color: var(--muted); font-size: 12px; }
    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      padding: 8px 12px;
      transition: transform .15s ease, border-color .15s ease;
    }
    button:hover { border-color: var(--accent); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .6; transform: none; }
    main { padding: 0 20px 20px; }
    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      padding: 14px;
    }
    .label { color: var(--muted); font-size: 11px; font-weight: 650; }
    .value { margin-top: 5px; font-size: 22px; font-weight: 760; letter-spacing: -.03em; }
    .value small { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0; }
    .usage-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--line);
      margin-bottom: 10px;
    }
    .usage-grid > div { background: var(--panel); padding: 12px 14px; }
    .mini-value { margin-top: 3px; font-size: 15px; font-weight: 700; }
    .progress { height: 7px; overflow: hidden; border-radius: 999px; background: var(--line); margin-top: 10px; }
    .progress > span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .35s ease; }
    .limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .limit-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .limit-name { font-weight: 720; }
    .limit-meta { color: var(--muted); font-size: 11px; text-align: right; }
    .empty { padding: 42px 20px; text-align: center; color: var(--muted); }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .pulse { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 18%, transparent); }
    @media (max-width: 560px) {
      .hero { grid-template-columns: 1fr 1fr; }
      .hero .card:first-child { grid-column: 1 / -1; }
      .usage-grid { grid-template-columns: 1fr 1fr; }
      .limits { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="shell">
    <header>
      <div>
        <div class="eyebrow">Local session</div>
        <h1>Codex usage</h1>
        <div class="sub" id="subtitle">Loading latest usage…</div>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <main id="content"><div class="empty">Waiting for usage data…</div></main>
  </section>
  <script>
    (() => {
      const content = document.getElementById('content');
      const subtitle = document.getElementById('subtitle');
      const refresh = document.getElementById('refresh');
      const pending = new Map();
      let requestId = 1;
      let latest = null;

      const nf = new Intl.NumberFormat(document.documentElement.lang || undefined, { notation: 'compact', maximumFractionDigits: 1 });
      const full = new Intl.NumberFormat(document.documentElement.lang || undefined);
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const num = (value) => Number.isFinite(Number(value)) ? Number(value) : 0;
      const pct = (value) => Math.max(0, Math.min(100, num(value)));
      const compact = (value) => nf.format(num(value));
      const money = (value) => `$${num(value).toFixed(4)}`;

      function ago(iso) {
        if (!iso) return 'just now';
        const seconds = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
        if (seconds < 60) return `${seconds}s ago`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        return `${Math.floor(seconds / 3600)}h ago`;
      }

      function resetText(iso) {
        if (!iso) return 'reset unavailable';
        return `resets ${new Intl.DateTimeFormat(document.documentElement.lang || undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso))}`;
      }

      function metric(label, value, suffix = '') {
        return `<div><div class="label">${esc(label)}</div><div class="mini-value" title="${esc(full.format(num(value)))}">${esc(compact(value))}${suffix}</div></div>`;
      }

      function limitCard(limit) {
        const used = pct(limit.usedPercent);
        return `<div class="card"><div class="limit-top"><div><div class="label">Rolling limit</div><div class="limit-name">${esc(limit.label)}</div></div><div class="limit-meta"><strong>${esc(used)}% used</strong><br>${esc(resetText(limit.resetsAt))}</div></div><div class="progress"><span style="width:${used}%"></span></div></div>`;
      }

      function render(data) {
        latest = data;
        if (!data || data.status !== 'ok') {
          subtitle.textContent = 'No local Codex session found';
          content.innerHTML = `<div class="empty">${esc(data?.message || 'Usage data is unavailable.')}</div>`;
          return;
        }

        const session = data.session || {};
        const total = data.totalUsage || {};
        const context = data.context || {};
        const limits = Array.isArray(data.limits) ? data.limits : [];
        const cost = data.cost;
        subtitle.textContent = `${session.model || 'Unknown model'} · think ${session.reasoningEffort || '—'} · updated ${ago(data.latestAt || data.generatedAt)}`;

        content.innerHTML = `
          <div class="hero">
            <div class="card"><div class="label">Session tokens</div><div class="value" title="${esc(full.format(num(total.totalTokens)))}">${esc(compact(total.totalTokens))} <small>total</small></div></div>
            <div class="card"><div class="label">Context</div><div class="value">${esc(pct(context.usedPercent))}%</div><div class="progress"><span style="width:${pct(context.usedPercent)}%"></span></div></div>
            <div class="card"><div class="label">Cache hit</div><div class="value">${esc(pct(total.cacheHitPercent))}%</div></div>
          </div>
          <div class="usage-grid">
            ${metric('Input', total.inputTokens)}
            ${metric('Cached input', total.cachedInputTokens)}
            ${metric('Output', total.outputTokens)}
            ${metric('Reasoning', total.reasoningOutputTokens)}
          </div>
          <div class="limits">${limits.length ? limits.map(limitCard).join('') : '<div class="card"><div class="label">Rolling limits</div><div class="mini-value">Unavailable</div></div>'}</div>
          <div class="footer"><span><span class="pulse"></span>Local data only</span><span>${cost ? `API≈${esc(money(cost.usd))}` : 'Cost unavailable'} · ${esc(session.turnCount || 0)} usage events</span></div>`;
      }

      function request(method, params) {
        const id = requestId++;
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;
        if (message.id !== undefined && pending.has(message.id)) {
          const promise = pending.get(message.id);
          pending.delete(message.id);
          if (message.error) promise.reject(message.error);
          else promise.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') {
          render(message.params?.structuredContent);
        }
      }, { passive: true });

      refresh.addEventListener('click', async () => {
        refresh.disabled = true;
        refresh.textContent = 'Refreshing…';
        try {
          const result = await request('tools/call', { name: 'show_usage', arguments: {} });
          render(result?.structuredContent || latest);
        } catch {
          subtitle.textContent = 'Refresh failed — try again';
        } finally {
          refresh.disabled = false;
          refresh.textContent = 'Refresh';
        }
      });

      if (window.openai?.toolOutput) render(window.openai.toolOutput);
    })();
  </script>
</body>
</html>
